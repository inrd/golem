<!DOCTYPE html>
<html>

<title>::::Golem</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A command driven outliner.">
<meta name="author" content="Thomas Hennebert">
</head>
<style>

body {
    color: #555;
    font-family: arial, helvetica, serif;
}

h2 {
    font-size: 0.9em;
    font-weight: normal;
    margin-bottom: 3em;
}

a {
    color: #15c8ff;
}

#cli {
    width: 80%;
    background-color: #444;
    color: #eee;
    height: 2em;
    font-family: monospace;
    margin-bottom: 1em;
}

p.info {
    color: #777;
    font-size: 0.8em;
    margin-top: 2px;
    margin-bottom: 2px;
}

pre {
    margin-top: 4em;
    background-color: #444;
    color: #eee;
    padding: 1em;
    height: auto;
    min-height: 400px;
    max-height: 400px;
    overflow: auto;
    word-break: normal !important;
    word-wrap: normal !important;
    white-space: pre-line !important;
}


</style>
<body>

    <script>

        function app() {

            function Node (title) {
                this.title = title;
                this.parent = null;
                this.children = [];
            }

            function Tree (title) {
                let node = new Node(title);
                this.root = node;
                this.focus = this.root;
            }

            Tree.prototype.traverse = function(callback) {
                (function recurse (node) {
                    node.children.forEach(function(child) {
                        recurse(child);
                    });
                    callback(node);
                })(this.root);
            };

            // Call to clean up a restored tree
            Tree.prototype.init_parents = function() {
                (function recurse (node, parent) {
                    node.children.forEach(function(child) {
                        recurse(child, node);
                    });
                    node.parent = parent;
                })(this.root, null);
            };

            const version = "1.2";

            const cli = document.getElementById("cli");
            const stdout = document.querySelector("#stdout");

            const selector = document.createElement('input');
            selector.type = "file";
            selector.accept = ".json";
            selector.addEventListener("change", handle_import_file, false);
            let import_mode = "tree";

            let tree = new Tree("Golem");
            let clipboard = null;
            let aliases = {};
            let history = [];
            const undo_levels = 8;

            function log_message(msg) {
                const log = document.createElement('p');
                log.textContent = msg;
                stdout.insertBefore(log, stdout.firstChild);
            }

            function parse_index_args (args) {
                if (args.length > 0 ){
                    if (!isNaN(args[0])) {
                        // first argument is a number, return index (conformed)
                        return parseInt(args[0]) - 1;
                    }
                    else {
                        // args are a search pattern, so iterate nodes
                        let pattern = args.join(" ");
                        let exp = new RegExp(pattern, "i");
                        for (let i = 0; i < tree.focus.children.length; i++) {
                            const node = tree.focus.children[i];
                            if (node.title.search(exp) !== -1) {
                                return i;
                            }
                        }
                        return undefined;
                    }
                }
                else {
                    return undefined;
                }
            }

            function get_focus_path () {
                if (tree.focus.parent === null) {
                    return "/";
                }
                let t = tree.focus;
                let p = "";
                while (t.parent !== null) {
                    p = "/" + t.title + p;
                    t = t.parent;
                }
                return p;
            }


            function serialize_tree () {
                const dump = JSON.stringify(tree.root, function (key, value) {
                    if (key === "parent") {
                        return null;
                    }
                    else {
                        return value;
                    }
                });
                return dump;
            }


            function deserialize_tree (json_data) {
                tree.root = json_data;
                tree.init_parents();
                tree.focus = tree.root;
            }

            function save_history () {
                const data = serialize_tree();
                history.push(data);
                if (history.length > undo_levels) {
                    history.shift();
                }
            }

            function undo () {
                const data = history.pop();
                return data;
            }


            function handle_import_file () {

                const file = selector.files[0];

                const reader = new FileReader();
                reader.addEventListener('load', function () {
                    const data = reader.result;
                    if (import_mode === 'alias') {
                        const al = JSON.parse(data);
                        if (al !== undefined) {
                            aliases = al;
                            localStorage.setItem('Golemaliases', JSON.stringify(aliases));
                            log_message("Aliases imported from JSON");
                        }
                        else {
                            log_message ("Failed to import from JSON");
                        }
                    }
                    else {
                        const new_tree = JSON.parse(data);
                        if (new_tree !== undefined) {
                            localStorage.clear();
                            deserialize_tree(new_tree);
                            list_cmd();
                            log_message("JSON data imported");
                        }
                        else {
                            log_message("Failed to import from JSON");
                        }
                    }
                });

                reader.readAsText(file);
            }



            // :::: Commands ::::

            function add_cmd (args) {
                const t = args.join(" ");
                tree.focus.children.push(new Node(t));
                tree.focus.children[tree.focus.children.length - 1].parent = tree.focus;
                list_cmd();
                log_message(`New node :::: ${t}`); 
            }
            
            function addp_cmd (args) {
                let idx = parseInt(args[0] - 1);
                if (idx === undefined) {
                    log_message("Invalid index");
                    return;
                }
                args.shift();
                const t = args.join(" ");
                const num_children = tree.focus.children.length;
                if (idx < 0) { idx = 0; }
                if (idx >= num_children) { idx = num_children -1; }
                tree.focus.children.splice(idx, 0, new Node(t));
                tree.focus.children[idx].parent = tree.focus;
                list_cmd();
                log_message(`New node :::: ${t}`); 
            }


            function addf_cmd (args) {
                const t = args.join(" ");
                tree.focus.children.push(new Node(t));
                tree.focus.children[tree.focus.children.length - 1].parent = tree.focus;
                tree.focus = tree.focus.children[tree.focus.children.length - 1];
                log_message(`Focus > New node :::: ${get_focus_path()}`); 
            }

            function del_cmd (args) {
                const nidx = parseInt(args[0]) - 1;
                if (!isNaN(nidx) && nidx < tree.focus.children.length) {
                    const t = tree.focus.children[nidx].title;
                    tree.focus.children.splice(nidx, 1);
                    list_cmd();
                    log_message(`Deleted node :::: ${t}`); 
                }
                else {
                    log_message("Invalid node");
                }
            }

            function edit_cmd (args) {
                const nidx = parseInt(args[0]) - 1;
                if (!isNaN(nidx) && nidx < tree.focus.children.length) {
                    args.splice(0, 1);
                    const msg = args.join(" ");
                    const t = tree.focus.children[nidx].title;
                    tree.focus.children[nidx].title = msg;
                    list_cmd();
                    log_message(`Edited node :::: ${t}\n=> ${msg}`); 
                }
                else {
                    log_message("Invalid node");
                }
            }

            function cut_cmd (args) {
                const nidx = parse_index_args(args);
                if (nidx !== undefined && nidx < tree.focus.children.length) {
                    clipboard = tree.focus.children[nidx];
                    tree.focus.children.splice(nidx, 1);
                    list_cmd();
                    log_message(`Cut node :::: ${clipboard.title}`); 
                }
                else {
                    log_message("Invalid node");
                }
            }

            function copy_cmd (args) {
                const nidx = parse_index_args(args);
                if (nidx !== undefined && nidx < tree.focus.children.length) {
                    clipboard = tree.focus.children[nidx];
                    log_message(`Copied node :::: ${clipboard.title}`); 
                }
                else {
                    log_message("Invalid node");
                }
            }

            function paste_cmd (args) {
                if (clipboard !== null) {
                    tree.focus.children.push(clipboard);
                    tree.focus.children[tree.focus.children.length - 1].parent = tree.focus;
                    list_cmd();
                    log_message(`Pasted node :::: ${clipboard.title}`); 
                }
            }

            function list_cmd (args) {
                let nl = `::::${get_focus_path()}\n`;
                if (tree.focus.children.length === 0) {
                    nl = nl + "Empty node...";
                }
                else {
                    tree.focus.children.forEach(function(node, idx) {
                        nl = nl + `${idx + 1}. `;
                        if (node.children.length > 0) {
                            nl = nl + "[+] ";
                        }
                        nl = nl + `${node.title}\n`;
                    });
                }
                log_message(nl);
            }

            function focus_cmd (args) {
                const nidx = parse_index_args(args);
                if (nidx !== undefined && nidx < tree.focus.children.length) {
                    tree.focus = tree.focus.children[nidx];
                    let nl = `Focus => ${get_focus_path()}\n`;
                    if (tree.focus.children.length === 0) {
                        nl = nl + "Empty node...";
                    }
                    else {
                        tree.focus.children.forEach(function(node, idx) {
                            nl = nl + `${idx + 1}. `;
                            if (node.children.length > 0) {
                                nl = nl + "[+] ";
                            }
                            nl = nl + `${node.title}\n`;
                        });
                    }
                    log_message(nl);
                }
                else {
                    log_message("Invalid node");
                }
            }

            function back_cmd (args)  {
                if (tree.focus.parent !== null) {
                    tree.focus = tree.focus.parent;
                    let nl = `Focus => ${get_focus_path()}\n`;
                    if (tree.focus.children.length === 0) {
                        nl = nl + "Empty node...";
                    }
                    else {
                        tree.focus.children.forEach(function(node, idx) {
                            nl = nl + `${idx + 1}. `;
                            if (node.children.length > 0) {
                                nl = nl + "[+] ";
                            }
                            nl = nl + `${node.title}\n`;
                        });
                    }
                    log_message(nl);
                }
                else {
                    log_message("Already at root...");
                }
            }

            function root_cmd (args) {
                if (tree.focus !== tree.root) {
                    tree.focus = tree.root;
                    let nl = `Focus => ${get_focus_path()}\n`;
                    if (tree.focus.children.length === 0) {
                        nl = nl + "Empty node...";
                    }
                    else {
                        tree.focus.children.forEach(function(node, idx) {
                            nl = nl + `${idx + 1}. `;
                            if (node.children.length > 0) {
                                nl = nl + "[+] ";
                            }
                            nl = nl + `${node.title}\n`;
                        });
                    }
                    log_message(nl);
                }
                else {
                    log_message("Already at root...");
                }
            }

            function search_cmd (args) {
                let pattern = args.join(" ");
                let exp = new RegExp(pattern, "i");
                let output = `Search :::: ${pattern}\n\n`;
                tree.traverse(function (node) {
                    if (node.title.search(exp) !== -1) {
                        if (node.parent === null) {
                            output = output + "::::/\n";
                        }
                        else {
                            let t = node;
                            let p = "";
                            while (t.parent !== null) {
                                p = "/" + t.title + p;
                                t = t.parent;
                            }
                            output = output + "=> " + p + "\n\n";
                        }
                    }
                });
                log_message(output);
            }

            function up_cmd (args) {
                if (args.length > 0) {
                    const src = parseInt(args.splice(0, 1)) - 1;
                    if (!isNaN(src) && src < tree.focus.children.length) {
                        let offset = 1;
                        const off = parseInt(args.splice(0, 1));
                        if (!isNaN(off) && off > 0) {
                            offset = off;
                        }
                        let new_idx = src - offset;
                        new_idx = new_idx < 0 ? 0 : new_idx;
                        new_idx = new_idx < tree.focus.children.length ? new_idx : tree.focus.children.length;
                        const tmp = tree.focus.children[src];
                        tree.focus.children.splice(src, 1);
                        tree.focus.children.splice(new_idx, 0, tmp);
                        list_cmd();
                    }
                    else {
                        log_message("Invalid node");
                    }
                }
                else {
                    log_message("Missing arguments");
                }
            }

            function down_cmd (args) {
                if (args.length > 0) {
                    const src = parseInt(args.splice(0, 1)) - 1;
                    if (!isNaN(src) && src < tree.focus.children.length) {
                        let offset = 1;
                        const off = parseInt(args.splice(0, 1));
                        if (!isNaN(off) && off > 0) {
                            offset = off;
                        }
                        let new_idx = src + offset;
                        new_idx = new_idx < 0 ? 0 : new_idx;
                        new_idx = new_idx < tree.focus.children.length ? new_idx : tree.focus.children.length;
                        const tmp = tree.focus.children[src];
                        tree.focus.children.splice(src, 1);
                        tree.focus.children.splice(new_idx, 0, tmp);
                        list_cmd();
                    }
                    else {
                        log_message("Invalid node");
                    }
                }
                else {
                    log_message("Missing arguments");
                }
            }


            function undo_cmd (args) {
                const json = undo();
                if (json !== undefined) {
                    const data = JSON.parse(json);
                    if (data !== undefined) {
                        deserialize_tree(data);
                        list_cmd();
                        log_message("Undo!");
                    }
                    else {
                        log_message("Could not restore from action history");
                    }
                }
                else {
                    log_message("Action history is empty");
                }
            }

            function export_cmd (args) {
                let mode = args[0];
                let dump = "";

                if (mode === 'alias') {
                    dump = JSON.stringify(aliases);
                }
                else {
                    dump = serialize_tree();
                }

                log_message(dump);
                let rng = document.createRange();
                rng.selectNode(stdout.firstChild);
                window.getSelection().addRange(rng);
                cli.blur();
            }

            function exportf_cmd (args) {
                let mode = args[0];
                let dump = "";
                const date = new Date();
                const year = date.getFullYear().toString();
                const month = (date.getMonth() + 1).toString();
                const day = date.getDate().toString();
                const hour = date.getHours().toString();
                const minutes = date.getMinutes().toString();
                let filename = year + "-" + month + "-" + day + "-" + hour + "-" + minutes + "-golem-";

                if (mode === 'alias') {
                    dump = JSON.stringify(aliases);
                    filename = filename + "aliases.json";
                }
                else {
                    dump = serialize_tree();
                    filename = filename + "tree.json";
                }

                const blob = new Blob([dump], {type: "application/json"});
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                document.body.appendChild(a);
                a.style = "display: none";
                a.href = url;
                a.download = filename;
                a.click();
                window.URL.revokeObjectURL(url);
                document.querySelector("body").removeChild(a);
            }

            function import_cmd (args) {
                let mode = args[0];

                if (mode === 'alias') {
                    args.splice(0, 1);
                    const data = args.join(" ");
                    const al = JSON.parse(data);
                    if (al !== undefined) {
                        aliases = al;
                        localStorage.setItem('Golemaliases', JSON.stringify(aliases));
                        log_message("Aliases imported from JSON");
                    }
                    else {
                        log_message ("Failed to import from JSON");
                    }
                }
                else {
                    const data = args.join(" ");
                    const new_tree = JSON.parse(data);
                    if (new_tree !== undefined) {
                        localStorage.clear();
                        deserialize_tree(new_tree);
                        list_cmd();
                        log_message("JSON data imported");
                    }
                    else {
                        log_message("Failed to import from JSON");
                    }
                }
            }


            function importf_cmd (args) {
                import_mode = args[0];
                selector.click();
            }

            function print_cmd (args) {
                let nodes_list = "";

                (function recurse (node) {
                    if (node !== tree.focus) {
                        let depth = 0;
                        let n = node;
                        let p = n.parent;
                        while (p !== tree.focus && p !== null) {
                            depth = depth + 1;
                            n = p;
                            p = n.parent;
                        }
                        for (let i = 0; i < depth; i++) {
                            nodes_list = nodes_list + "&emsp;&emsp;";
                        }
                        nodes_list = nodes_list + `- ${node.title}\n`;
                    }
                    
                    node.children.forEach(function(child) {
                        recurse(child);
                    });
                })(tree.focus);

                const txt = document.createElement('p');
                txt.innerHTML = nodes_list;
                stdout.insertBefore(txt, stdout.firstChild);

                if (args[0] === "select") {
                    let rng = document.createRange();
                    rng.selectNode(stdout.firstChild);
                    window.getSelection().addRange(rng);
                    cli.blur();
                }
            }

            function alias_cmd (args) {
                const mode = args[0];
                if (mode === 'add') {
                    const alname = args[1];
                    const cmname = args[2];
                    if (alname !== undefined && cmname !== undefined) {
                        aliases[alname] = cmname;
                        log_message(`Added alias :::: ${alname} => ${cmname}`);
                        localStorage.setItem('Golemaliases', JSON.stringify(aliases));
                    }
                    else {
                        log_message("Invalid arguments");
                    }
                }
                else if (mode === 'del') {
                    const alname = args[1];
                    if(alname !== undefined) {
                        delete aliases[alname];
                        log_message(`Deleted alias :::: ${alname}`);
                        localStorage.setItem('Golemaliases', JSON.stringify(aliases));
                    }
                    else {
                        log_message("Invalid arguments");
                    }
                }
                else if (mode === 'list') {
                    let al = "::::Aliases\n\n";

                    for (const alias in aliases) {
                        al = al + `${alias} => ${aliases[alias]}\n`
                    }
                    log_message(al);
                }
                else {
                    log_message("Invalid arguments");
                }
            }

            function reset_cmd (args) {
                localStorage.clear();
                tree = new Tree("Golem");
                log_message("Removed all nodes");
            }

            function cls_cmd (args) {
                stdout.innerHTML = "";
            }

            const commands = {
                add: {
                    target: add_cmd,
                    mutating: true,
                    summary: "append new node",
                    help: ":::: add [text] ::::\nappend a new node to the current list with the content defined in [text]"
                },
                addp: {
                    target: addp_cmd,
                    mutating: true,
                    summary: "insert new node at index",
                    help: ":::: addp [index] [text] ::::\ninsert a new node in the current list at [index] with the content defined in [text]"
                },
                addf: {
                    target: addf_cmd,
                    mutating: true,
                    summary: "append new node and focus it",
                    help: ":::: add [text] ::::\nappenda new node to the current list with the content defined in [text] and move focus to the new node"
                },
                del: {
                    target: del_cmd,
                    mutating: true,
                    summary: "delete node at index",
                    help: ":::: del [node index] ::::\ndelete the node at [node index]"
                },
                edit: {
                    target: edit_cmd,
                    mutating: true,
                    summary: "edit node at index",
                    help: ":::: edit [node index] [new text] ::::\nreplace the node text at [node index] by [new text]"
                },
                cut: {
                    target: cut_cmd,
                    mutating: true,
                    summary: "cut node at index",
                    help: ":::: cut [node index || search pattern] ::::\ndelete the node at [node index] or containing [search pattern] and copy its contents (recursively) to the internal clipboard"
                },
                copy: {
                    target: copy_cmd,
                    mutating: false,
                    summary: "copy node at index",
                    help: ":::: copy [node index || search pattern] ::::\ncopy the contents (recursively) of the node at [node index] or containing [search pattern] to the internal clipboard"
                },
                paste: {
                    target: paste_cmd,
                    mutating: true,
                    summary: "paste node",
                    help: ":::: paste ::::\nappend the contents of the internal clipboard to the current node"
                },
                list: {
                    target: list_cmd,
                    mutating: false,
                    summary: "list contents of current node",
                    help: ":::: list ::::\nprint the contents of the current node to the console\nnodes which contain sub-nodes have a little indicator ([+]) after their index"
                },
                focus: {
                    target: focus_cmd,
                    mutating: false,
                    summary: "bring focus to a specific node",
                    help: ":::: focus [node index || search pattern] ::::\nset the root node to [node index] or to the first node matching [search pattern]"
                },
                back: {
                    target: back_cmd,
                    mutating: false,
                    summary: "move up in the tree",
                    help: ":::: back ::::\nmove back (up) in the hierarchy"
                },
                root: {
                    target: root_cmd,
                    mutating: false,
                    summary: "move to the tree root",
                    help: ":::: root ::::\nmove back to the root node"
                },
                search: {
                    target: search_cmd,
                    mutating: false,
                    summary: "search expression in the whole tree",
                    help: ":::: search [pattern] ::::\nsearch (case insensitive) the whole tree for [pattern]"
                },
                up: {
                    target: up_cmd,
                    mutating: true,
                    summary: "move node up in the list",
                    help: ":::: up [node index] [offset (optional)] ::::\nmove the node at [node index] up in the list by [offset] places (defaults to 1 if offset is omitted)"
                },
                down: {
                    target: down_cmd,
                    mutating: true,
                    summary: "move node down in the list",
                    help: ":::: down [node index] [offset (optional)] ::::\nmove the node at [node index] down in the list by [offset] places (defaults to 1 if offset is omitted)"
                },
                undo: {
                    target: undo_cmd,
                    mutating: true,
                    summary: "undo previous destructive action",
                    help: ":::: undo ::::\nrevert latest destructive action (will reset the focus to the root node)"
                },
                print: {
                    target: print_cmd,
                    mutating: false,
                    summary: "print plain text subtree of the current node",
                    help: ":::: print [select (optional)]::::\nprint a flat list version of the currently focused node to the console\nif select is passed as an argument, the focus will move out of the command  prompt and the text will be automatically selected"
                },
                export: {
                    target: export_cmd,
                    mutating: false,
                    summary: "dump the whole tree or the aliases list to the console as a JSON string",
                    help: ":::: export [alias (optional)] ::::\ndump the whole tree to the console as a JSON string that can be used with the import command\nif the alias argument is passed in it will dump the list of aliases as a JSON string\nsee the exportf command to generate a JSON file"
                },
                exportf: {
                    target: exportf_cmd,
                    mutating: false,
                    summary: "dump the whole tree or the aliases list to a JSON file",
                    help: ":::: exportf [alias (optional)] ::::\ndump the whole tree as a JSON file that can be used with the importf command\nif the alias argument is passed in it will dump the list of aliases as a JSON string"
                },
                import: {
                    target: import_cmd,
                    mutating: true,
                    summary: "import the whole tree or the aliases list from a JSON string",
                    help: ":::: import [alias (optional)] [json string] ::::\nimport the JSON string (obtained via the export command) passed as an argument and replace the whole tree\nif the alias argument is passed in it will try to restore the alias list from the  JSON instead\nto load the data from a json file, use the importf command"
                },
                importf: {
                    target: importf_cmd,
                    mutating: true,
                    summary: "import the whole tree or the aliases list from a JSON file",
                    help: ":::: import [alias (optional)] ::::\nopen a file selection dialog and import the selected JSON file (obtained via the exportf command) replacing the whole tree\nif the alias argument is passed in it will try to restore the alias list from the JSON instead"
                },
                alias: {
                    target: alias_cmd,
                    mutating: true,
                    summary: "define or delete an alias for a command, or list registered aliases",
                    help: ":::: alias [add || del || list] [alias name (optional)] [target command (optional)] ::::\nadd, delete or list command aliases\nalias add ls list => set the alias ls for the list command\nalias del ls => remove the alias ls\nalias list => print all registered aliases to the console"
                },
                reset: {
                    target: reset_cmd,
                    mutating: true,
                    summary: "remove all nodes from the tree",
                    help: ":::: reset ::::\nremove all nodes (make sure to export before...)"
                },
                cls: {
                    target: cls_cmd,
                    mutating: false,
                    summary: "clear the console",
                    help: ":::: cls ::::\nclear the console"
                }
            };


            function print_help (cmd) {
                if (commands.hasOwnProperty(cmd)) {
                    log_message(commands[cmd].help);
                }
                else {
                    let cmd_list = "";
                    for (key in commands) {
                        cmd_list = cmd_list + `- ${key} => ` + `${commands[key].summary}\n`;  
                    }
                    log_message(`Type "help [command]" to get help about a specific command.\n\nPossible commands :\n\n${cmd_list}\n\n`);
                }
            }

            function run_command () {

                const args = cli.value.split(" ");
                let cmd = args[0];
                args.splice(0, 1);

                if (aliases.hasOwnProperty(cmd)) {
                    cmd = aliases[cmd];
                }

                if (commands.hasOwnProperty(cmd)) {
                    if (commands[cmd].mutating === true && cmd !== 'undo') {
                        save_history();
                    }

                    commands[cmd].target(args);
                    // save changes if needed
                    if (commands[cmd].mutating === true) {
                        localStorage.setItem('Golemtree', serialize_tree());
                    }
                }
                else if (cmd === "help") {
                    print_help(args.join(" "));
                }
                else {
                    log_message("Invalid command");
                }

                // Clear command prompt
                cli.value = "";

            }



            // startup
            if (localStorage.getItem('Golemtree')) {
                deserialize_tree(JSON.parse(localStorage.getItem('Golemtree')));
            }

            if (localStorage.getItem('Golemaliases')) {
                aliases = JSON.parse(localStorage.getItem('Golemaliases'));
            }

            cli.value = "";
            cli.addEventListener("keyup", function(event) {
                if (event.key === "Enter") {
                    run_command();
                }
            });

            list_cmd();
            log_message(`::::Golem version ${version}`);
            cli.focus();
        }


        document.addEventListener('DOMContentLoaded', app);

    </script>


    <h1>::::Golem</h1>
    <h2>Command driven outliner</h2>

    <input type="text" id="cli" name="cli">

    <p class="info"><em>Type a command and press <code>&lt;enter&gt;</code> to run.</em></p>
    <p class="info"><em>Type <code>help</code> for addtional information.</em></p>

    <pre id="stdout">
    </pre>

</body>
